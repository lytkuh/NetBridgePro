<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="39%" r="85%">
      <stop offset="0%" stop-color="#182433"/>
      <stop offset="100%" stop-color="#0A0E15"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="54%" r="40%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
